server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: askbase
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 把 .env 当成 properties 读进来。这样 Key 只存在一个地方（.env），
  # 既给 docker compose 用，也给应用用，不用两边各填一遍。
  # optional: 前缀保证 .env 不存在时也能启动。
  config:
    import: optional:file:.env[.properties]
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      connect-timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

askbase:
  auth:
    jwt:
      # ⚠️ 生产环境必须通过环境变量覆盖，不要用这个默认值
      secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789abcdef}
      expire-minutes: 720
    users:
      # 开发用户，后续换成 sys_user 表
      admin: ${DEV_ADMIN_PASSWORD:admin123}

  schema:
    # 召回策略：keyword（无需 Key）| vector | hybrid | rerank（推荐）
    # rerank = 混合召回取全部候选 → LLM 精排。实测 EA 从 94-96% 提到 96-100%，
    # 代价是每次问答多一次模型调用（约 +0.5s）。
    # 缺 Key 时会自动降级：没有 chat key → keyword，只有 chat 没有 embedding → 也是 keyword
    retriever: ${SCHEMA_RETRIEVER:rerank}
    # 召回几张表。给多了是干扰项，给少了 JOIN 不出来
    top-k: 6
    # 取值数 ≤ 此值的字符串列视为枚举，采样取值塞进 prompt
    enum-max-distinct: 20
    enum-sample-limit: 8
    sample-row-limit: 2
    reindex-on-startup: true
    # 应用自己的表不能进索引，否则模型可能去查 sys_user
    excluded-tables:
      - sys_user
      - sys_table_permission
      - query_log

  query:
    # 最多尝试几轮（含首轮）。1 = 关闭自纠错。
    # 默认 2：首生成 + 一次纠错。再加收益递减——同一份 prompt 下连错两次，第三次多半还是错。
    max-attempts: ${QUERY_MAX_ATTEMPTS:2}
    # 结果为空时是否重试。空结果可能是正确答案，但实测更多是枚举值写错导致的假空。
    retry-on-empty-result: true
    # 多轮对话最多带几轮历史进 prompt（服务端截断，客户端传多少都不会失控）
    max-history-turns: 3
    # 执行模型生成的 SQL 用这个只读连接。和应用主库分开是硬性要求：
    # 主库要写 sys_user/query_log，必须是读写账号；
    # 执行不可信 SQL 必须用只有 SELECT 权限的账号。
    readonly:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:askbase}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: ${DB_RO_USER:askbase_ro}
      password: ${DB_RO_PASSWORD:askbase_ro123}
      max-pool-size: 5
      connection-timeout-ms: 3000
      # 单条 SQL 超时（秒）。防止全表扫描占死连接
      query-timeout-seconds: 5
      # 结果集上限。超过会被截断并在返回里标 truncated
      max-rows: 1000

  ai:
    # 对话走 DeepSeek：SQL 生成能力强、便宜（约 ¥1/百万 token）
    chat:
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${AI_CHAT_MODEL:deepseek-chat}
      # 必须为 0：否则同一个问题两次生成不同 SQL，评估无法复现
      temperature: 0.0
      max-tokens: 1024
    # 向量走 DashScope：DeepSeek 没有 embedding 模型
    embedding:
      # ⚠️ 不要带 /v1 —— Spring AI 会自己拼 /v1/embeddings，
      # 写成 .../compatible-mode/v1 会变成 /v1/v1/embeddings，报 404
      base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
      # 换模型时必须同步改这里，否则向量索引维度对不上
      dimensions: 1024

  # 业务口径（语义层）。
  #
  # ⚠️ 默认关闭，这是实测结论不是保守：
  #   无口径 50% → 1 条口径 40% → 6 条口径 30%
  # 加规则会让准确率单调下降。原因是规则占用了 prompt 的注意力，
  # 模型对 schema 字段名的关注度下降，反而开始幻觉不存在的列。
  #
  # 同样的口径改成写进表注释（offer 表注释里"必须只算已签约"），
  # 效果比写成 prompt 规则好——注释跟 schema 绑在一起，不额外占注意力。
  #
  # 想开的话先做对照实验：--askbase.semantic.enabled=false 跑一遍评估，
  # 再开启跑一遍，差值就是这批规则的真实价值。
  semantic:
    enabled: ${SEMANTIC_ENABLED:false}
    rules:
      - "统计薪资、起薪、平均月薪时，只统计 sign_status = '已签约' 的 offer；未签约和已违约的不计入"
      # 以下规则实测未带来提升，保留作候选
      # - "就业率 = 已签约学生数 / 毕业生数。分子分母都按 DISTINCT 学生统计"
      # - "employment_stat 中 major_id IS NULL 表示学院级汇总，不能与专业级明细混算"
      # - "「就业地点」用 company.city 近似"
      # - "LEFT JOIN 的附加过滤条件必须写在 ON 里，不能写在 WHERE 里"
      # - "平均分是百分制，GPA 满分 4.00，两者不要混用"

logging:
  level:
    com.askbase: info
    org.springframework.web: info
