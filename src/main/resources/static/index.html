<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Askbase · 用中文问你的数据</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563EB'/><text x='16' y='23' font-size='19' font-family='sans-serif' font-weight='600' fill='white' text-anchor='middle'>A</text></svg>">
</head>
<body>

<!-- 登录 -->
<section id="login-view" class="login-wrap" hidden>
  <form id="login-form" class="login-card">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <h1>Askbase</h1>
        <p class="muted">用中文问你的数据库</p>
      </div>
    </div>
    <label>
      用户名
      <input id="username" type="text" value="admin" autocomplete="username" required>
    </label>
    <label>
      密码
      <input id="password" type="password" placeholder="演示默认 admin123" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="error" hidden></p>
    <button type="submit" class="primary">登录</button>
    <p class="hint">演示环境默认账号 admin，密码 admin123（部署时若改了 DEV_ADMIN_PASSWORD，请用你设的密码）</p>
  </form>
</section>

<!-- 主界面 -->
<div id="app-view" hidden>
  <header class="topbar">
    <div class="brand small">
      <div class="brand-mark">A</div>
      <span class="brand-name">Askbase</span>
    </div>
    <div class="topbar-right">
      <span id="retriever-badge" class="badge" title="当前召回策略"></span>
      <button id="new-chat" class="ghost" hidden>新对话</button>
      <button id="logout" class="ghost">退出</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h2>问一句话，拿到数据</h2>
      <p class="muted">自动识别相关的表、生成 SQL、校验安全性后执行。可以接着追问，比如「那 2024 届呢」。</p>

      <form id="ask-form" class="ask-box">
        <textarea id="question" rows="2" placeholder="例如：各专业平均薪资是多少" required></textarea>
        <button type="submit" class="primary" id="ask-btn">提问</button>
      </form>

      <div class="examples" id="examples">
        <span class="examples-label">试试：</span>
      </div>
    </section>

    <section id="status" class="status" hidden>
      <span class="spinner"></span>
      <span id="status-text">正在理解问题…</span>
    </section>

    <div id="thread" class="thread"></div>
  </main>

  <footer class="footer">
    <span>Askbase · NL2SQL Agent</span>
    <a href="/swagger-ui.html" target="_blank" rel="noopener">接口文档</a>
  </footer>
</div>

<!-- 一轮对话的模板 -->
<template id="turn-tpl">
  <article class="turn">
    <div class="turn-q">
      <span class="turn-q-mark">问</span>
      <span class="turn-q-text"></span>
    </div>

    <div class="turn-body">
      <p class="explanation"></p>
      <div class="meta"></div>

      <div class="chart-wrap" hidden>
        <canvas role="img" aria-label="查询结果图表"></canvas>
      </div>

      <div class="table-wrap">
        <table>
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <p class="truncated-note hint" hidden></p>

      <details class="sql-details">
        <summary>SQL 与执行详情</summary>
        <pre></pre>
        <div class="attempts"></div>
      </details>
    </div>

    <div class="turn-error alert" hidden></div>
  </article>
</template>

<!-- 本地托管而不是 CDN：服务器带宽只有 1Mbps，且 jsdelivr 在国内不稳定。
     挂了的话图表不显示（代码有降级，只显示表格），但演示效果差很多。 -->
<script src="vendor/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
